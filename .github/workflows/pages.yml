name: Deploy to GitHub Pages

# The app has no build step, so this just uploads the repo as a static site.
#
# Tests run for pushes to any branch; only the repository's default branch is
# deployed. The default branch is read at run time rather than hardcoded, so
# this keeps working if the branch is renamed or merged into `main` later.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test

  deploy:
    needs: test
    # Deploy only the default branch, or a manual run of any branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Warn if sharing is not configured
        run: |
          if grep -qE "supabaseUrl \?\? ''" src/config.js && \
             ! grep -qE "^export const SUPABASE_URL = 'https" src/config.js; then
            echo "::warning title=Sharing disabled::src/config.js has no Supabase URL, so the deployed site will be local-only (no Share button). See docs/sharing-setup.md."
          else
            echo "Sharing is configured."
          fi

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
