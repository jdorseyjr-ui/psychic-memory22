name: Keep Supabase awake

# Supabase pauses free-tier projects after about a week of inactivity. Nothing
# is lost, but sharing stops working until someone restores the project by
# hand, and the app reports the outage as "Offline" — which sends you looking
# at your phone's signal rather than at the dashboard.
#
# Three cheap requests a week keep the project counted as active. Public
# repositories get unlimited Actions minutes, so this costs nothing.
on:
  schedule:
    # Mondays, Wednesdays and Fridays. Two details are deliberate:
    #
    #   - Three days, not one. The longest gap is Friday to Monday, so even a
    #     dropped run leaves a comfortable margin under the ~7-day threshold.
    #   - :23, not :00. GitHub delays or silently drops scheduled runs that
    #     pile up at the top of the hour, and a missed ping here isn't visible
    #     until sharing breaks days later.
    - cron: '23 9 * * 1,3,5'
  workflow_dispatch:

# A ping already in flight is as good as a new one.
concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The script reads the project URL and anon key from src/config.js, so
      # there is no secret to configure and no second copy to keep in step.
      # That key is public by design — see the security note in db/schema.sql.
      - name: Ping the database
        run: node tools/keepalive.mjs
